apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - externalsecretconfig.yaml

patches:
  - target:
      kind: Subscription
      name: openshift-external-secrets-operator
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable-v1
