apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer: {}
    dashboard: {}
    devfileRegistry: {}
    pluginRegistry: {}
    metrics:
      enable: true
  containerRegistry: {}
  devEnvironments:
    defaultNamespace:
      template: <username>-devspaces
    maxNumberOfWorkspacesPerUser: 2
    maxNumberOfRunningWorkspacesPerUser: 1
    maxNumberOfRunningWorkspacesPerCluster: 20
    allowedSources:
      urls:
        - PATCH-ME
  gitServices: {}
  networking: {}
